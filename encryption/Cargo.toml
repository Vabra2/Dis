[package]
name = "dis-encryption"
version = "0.1.0"
edition = "2021"
authors = ["Dis Team"]
description = "E2E encryption using Signal Protocol for Dis chat platform"
license = "AGPL-3.0"

[dependencies]
# Signal Protocol implementation
libsignal-protocol = "0.1"

# Cryptography
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
x25519-dalek = "2.0"
ed25519-dalek = "2.0"
curve25519-dalek = "4.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Base64 encoding
base64 = "0.21"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
criterion = "0.5"

[lib]
name = "dis_encryption"
path = "src/lib.rs"

[[bench]]
name = "encryption_bench"
harness = false
