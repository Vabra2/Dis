[package]
name = "dis-auth"
version = "0.1.0"
edition = "2021"
authors = ["Dis Team"]
description = "Anonymous authentication for Dis chat platform"
license = "AGPL-3.0"

[dependencies]
# Password hashing
argon2 = "0.5"

# Random generation
rand = "0.8"
uuid = { version = "1.6", features = ["v4", "serde"] }

# Cryptography
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Base64 encoding
base64 = "0.21"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"

[lib]
name = "dis_auth"
path = "src/lib.rs"
