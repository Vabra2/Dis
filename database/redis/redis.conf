# Redis Configuration for Dis
# Optimized for security and privacy

# Network
bind 0.0.0.0
port 6379
protected-mode yes

# Security
requirepass ${REDIS_PASSWORD}

# Disable dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG ""
rename-command SHUTDOWN ""

# Memory management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence (minimal for privacy)
# Using RDB with infrequent snapshots
save 900 1
save 300 10
save 60 10000

# Disable AOF for privacy (can be enabled if needed)
appendonly no

# Slow log (for monitoring, without sensitive data)
slowlog-log-slower-than 10000
slowlog-max-len 128

# Logging (minimal)
loglevel notice
logfile ""

# Database
databases 16

# Timeouts
timeout 300
tcp-keepalive 300

# Performance
tcp-backlog 511
maxclients 10000

# TLS (configure if needed)
# tls-port 6380
# tls-cert-file /path/to/redis.crt
# tls-key-file /path/to/redis.key
# tls-ca-cert-file /path/to/ca.crt

# Disable unused features
lua-time-limit 5000
